<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="sidora-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <linearGradient id="sidora-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#2dd4bf" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#059669" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="120" fill="url(#sidora-bg)" filter="url(#glow)" />
  
  <!-- Subtle Inner Border -->
  <rect x="36" y="36" width="440" height="440" rx="108" fill="none" stroke="white" stroke-opacity="0.2" stroke-width="6" />

  <!-- Orbit / Care Ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="white" stroke-opacity="0.25" stroke-width="12" stroke-dasharray="24 16" />

  <!-- Heart / Care Wave Shape -->
  <path d="M256 130 C200 80, 120 120, 120 200 C120 280, 256 370, 256 370 C256 370, 392 280, 392 200 C392 120, 312 80, 256 130 Z" fill="white" fill-opacity="0.12" />

  <!-- Medical Cross + Pulse in Center -->
  <rect x="232" y="156" width="48" height="200" rx="24" fill="white" />
  <rect x="156" y="232" width="200" height="48" rx="24" fill="white" />

  <!-- Center Notification Bell / Sparkle Accent -->
  <circle cx="256" cy="256" r="28" fill="url(#sidora-accent)" />
  <circle cx="256" cy="256" r="14" fill="white" />

  <!-- Pulse Wave Nodes -->
  <circle cx="156" cy="256" r="10" fill="#34d399" />
  <circle cx="356" cy="256" r="10" fill="#34d399" />
  <circle cx="256" cy="156" r="10" fill="#34d399" />
  <circle cx="256" cy="356" r="10" fill="#34d399" />
</svg>
